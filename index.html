by_name[label][\"nunique\"] != len(df):\n        return None\n    unit = next((p[\"name\"] for p in profiles if re.fullmatch(r\"units?|uom|measure\", str(p[\"name\"]).strip(), re.I)), None)\n    better = next((p[\"name\"] for p in profiles if re.search(r\"better|direction|good when\", str(p[\"name\"]), re.I)), None)\n    return {\"label\": label, \"latest\": numeric[-1], \"prev\": numeric[-2] if len(numeric) >= 2 else \"\", \"unit\": unit, \"better\": better}\n\n\ndef _metric_table_kpis(df, mt: dict) -> list:\n    out = []\n    for _, row in df.head(MAX_KPIS).iterrows():\n        name = str(row[mt[\"label\"]])\n        unit = str(row[mt[\"unit\"]]).strip() if mt[\"unit\"] and pd.notna(row[mt[\"unit\"]]) else \"\"\n        val = pd.to_numeric(pd.Series([row[mt[\"latest\"]]]), errors=\"coerce\").iloc[0]\n        fmt = \"percent\" if unit == \"%\" and pd.notna(val) and abs(val) <= 1.5 else \"percent_points\" if unit == \"%\" else \"number\"\n        better = str(row[mt[\"better\"]]).lower() if mt[\"better\"] and pd.notna(row[mt[\"better\"]]) else \"\"\n        sub = unit\n        if mt[\"prev\"]:\n            prev = pd.to_numeric(pd.Series([row[mt[\"prev\"]]]), errors=\"coerce\").iloc[0]\n            prev_text = fmt_value(float(prev), fmt) if pd.notna(prev) else str(row[mt[\"prev\"]])\n            sub = f\"{mt['prev']}: {prev_text}\" if unit == \"%\" else f\"{unit} | {mt['prev']}: {prev_text}\"\n        out.append({\"title\": name, \"agg\": \"cell\", \"column\": mt[\"latest\"], \"column2\": mt[\"prev\"], \"filter_value\": name,\n                    \"label_col\": mt[\"label\"], \"fmt\": fmt, \"why\": f\"{mt['latest']} value\", \"sub\": sub.strip(\" |\"),\n                    \"lower_better\": \"lower\" in better, \"group\": name})\n    return out\n\n\ndef build_plan(domain: str, roles: dict, profiles: list, ai_kpis=(), ai_charts=(), df=None) -> dict:\n    columns = {p[\"name\"] for p in profiles}\n    kinds = {p[\"name\"]: p[\"kind\"] for p in profiles}\n    inverse_roles = {v: k for k, v in roles.items()}\n\n    mt = metric_table(df, roles, profiles)\n    kpis, seen_groups, seen_titles = [], set(), set()\n    if mt:\n        kpis = _metric_table_kpis(df, mt)\n    candidates = [] if mt else list(ai_kpis) + KPI_TEMPLATES.get(domain, []) + _auto_kpis(profiles, roles, domain)\n    for spec in candidates:\n        r = resolve_kpi(spec, roles, columns)\n        if not r:\n            continue\n        key = (r[\"agg\"], r.get(\"column\") or \"\", r.get(\"column2\") or \"\", r.get(\"filter_value\") or \"\")\n        group = spec.get(\"group\") or spec[\"title\"]\n        if group in seen_groups:\n            continue\n        if r[\"title\"].lower() in seen_titles or key in seen_titles:\n            # the AI already covers this KPI, so its template alternatives (same group) are covered too\n            seen_groups.add(group)\n            continue\n        if group == \"records\" and any(k[\"agg\"] == \"count_rows\" or k[\"title\"] in COUNT_TITLES for k in kpis):\n            continue\n        seen_groups.add(group)\n        seen_titles.update({r[\"title\"].lower(), key})\n        r[\"lower_better\"] = spec.get(\"lower_better\", inverse_roles.get(r.get(\"column\")) in LOWER_IS_BETTER)\n        kpis.append(r)\n        if len(kpis) >= MAX_KPIS:\n            break\n\n    charts, seen = [], set()\n    if mt:\n        # rows carry different units, so sums across them mean nothing: compare periods per metric instead\n        chart_candidates = [\n            {\"type\": \"change_bar\", \"title\": f\"Change from {mt['prev']} to {mt['latest']}\", \"x\": mt[\"label\"], \"y\": mt[\"latest\"],\n             \"y2\": mt[\"prev\"], \"color\": mt[\"better\"] or \"\", \"agg\": \"sum\", \"why\": \"Green bars moved the right way, orange the wrong way\"},\n        ] if mt[\"prev\"] else []\n        chart_candidates += [{\"type\": \"grouped_bar\", \"title\": f\"{mt['prev']} vs {mt['latest']} by {mt['label']}\", \"x\": mt[\"label\"],\n                              \"y\": f\"{mt['prev']}|{mt['latest']}\", \"agg\": \"sum\", \"color\": \"\", \"y2\": \"\", \"why\": \"Side-by-side values per metric\"}]\n        if \"status\" in roles:\n            chart_candidates.append({\"type\": \"donut\", \"title\": \"Status of metrics\", \"x\": roles[\"status\"], \"y\": \"\", \"agg\": \"count\",\n                                     \"color\": \"\", \"y2\": \"\", \"why\": \"\"})\n    else:\n        chart_candidates = list(ai_charts) + CHART_TEMPLATES.get(domain, [])\n    nunique = {p[\"name\"]: p[\"nunique\"] for p in profiles}\n    auto_added = bool(mt)\n    i = 0\n    while True:\n        if i >= len(chart_candidates):\n            # generic charts only top up a thin plan\n            if auto_added or len(charts) >= 8:\n                break\n            chart_candidates += _auto_charts(profiles, roles, domain)\n            auto_added = True\n            continue\n        spec = chart_candidates[i]\n        i += 1\n        r = resolve_chart(spec, roles, columns, kinds)\n        if not r:\n            continue\n        # a split by a column with one value (e.g. a single country) shows nothing\n        if r[\"type\"] not in (\"histogram\", \"scatter\", \"line\", \"weekday_heatmap\", \"waterfall\", \"metric_funnel\", \"change_bar\") and \\\n                (nunique.get(r[\"x\"], 2) < 2 or (r.get(\"color\") and nunique.get(r[\"color\"], 2) < 2)):\n            continue\n        # one histogram per column and one weekday heatmap per date, whatever measure they show\n        key = (r[\"type\"], r[\"x\"]) if r[\"type\"] in (\"histogram\", \"weekday_heatmap\") else (r[\"type\"], r[\"x\"], r[\"y\"], r[\"agg\"], r[\"color\"])\n        if key in seen or r[\"title\"].lower() in seen:\n            continue\n        seen.update({key, r[\"title\"].lower()})\n        charts.append(r)\n        if len(charts) >= MAX_CHARTS:\n            break\n    return {\"kpis\": kpis, \"charts\": charts, \"metric_table\": mt}\n\n\ndef measure_agg(measure: str, roles: dict, profiles_by_name: dict) -> str:\n    inverse = {v: k for k, v in roles.items()}\n    p = profiles_by_name.get(measure, {})\n    if inverse.get(measure) in MEAN_ROLES or p.get(\"percent\") or \\\n            re.search(r\"(avg|average|mean|rate|score|rating|csat|nps|%)\", str(measure), re.I):\n        return \"mean\"\n    return \"sum\"\n\n\ndef _usable_dims(profiles, roles, max_card=30):\n    role_priority = [\"region\", \"product\", \"category\", \"department\", \"channel\", \"agent\", \"salesperson\", \"job\",\n                     \"status\", \"priority\", \"gender\", \"customer\", \"stage\", \"metric_name\"]\n    by_name = {p[\"name\"]: p for p in profiles}\n    dims = [roles[r] for r in role_priority if r in roles and by_name.get(roles[r], {}).get(\"kind\") in (\"categorical\", \"boolean\", \"identifier\")\n            and 2 <= by_name[roles[r]][\"nunique\"] <= max(max_card, 1000)]\n    # names and ids make poor groupings: one row each\n    skip = {roles[r] for r in (\"employee\", \"order_id\", \"ticket_id\", \"employee_id\") if r in roles}\n    for p in profiles:\n        if p[\"kind\"] in (\"categorical\", \"boolean\") and 2 <= p[\"nunique\"] <= max_card and p[\"name\"] not in dims \\\n                and p[\"name\"] not in skip:\n            dims.append(p[\"name\"])\n    return dims\n\n\ndef _auto_kpis(profiles, roles, domain):\n    out = [{\"title\": \"Records\", \"agg\": \"count_rows\", \"column\": \"\", \"column2\": \"\", \"fmt\": \"number\", \"why\": \"Rows in the current view\", \"group\": \"records\"}]\n    assigned = set(roles.values())\n    numeric = [p for p in profiles if p[\"kind\"] == \"numeric\"]\n    numeric.sort(key=lambda p: (p[\"name\"] not in assigned, -abs(p.get(\"sum\", 0))))\n    by_name = {p[\"name\"]: p for p in profiles}\n    for p in numeric[:5]:\n        agg = measure_agg(p[\"name\"], roles, by_name)\n        if agg == \"sum\" and re.search(r\"(price|age|time|hrs|duration|tenure)\", p[\"name\"], re.I):\n            agg = \"mean\"\n        title = f\"{'Avg' if agg == 'mean' else 'Total'} {p['name']}\"\n        out.append({\"title\": title, \"agg\": agg, \"column\": p[\"name\"], \"column2\": \"\", \"fmt\": \"auto\", \"why\": \"\", \"group\": title})\n    return out\n\n\ndef _auto_charts(profiles, roles, domain):\n    by_name = {p[\"name\"]: p for p in profiles}\n    measure = primary_measure(domain, roles, profiles)\n    numeric = [p[\"name\"] for p in profiles if p[\"kind\"] == \"numeric\"]\n    dims = _usable_dims(profiles, roles)\n    dates = [p[\"name\"] for p in profiles if p[\"kind\"] in (\"datetime\", \"period\")]\n    m_agg = measure_agg(measure, roles, by_name) if measure else \"count\"\n    out = []\n    date = roles.get(\"date\") or (dates[0] if dates else None)\n\n    # small wide tables (one row per metric / month / item) read best as grouped bars\n    label = next((p[\"name\"] for p in profiles if p[\"kind\"] in (\"categorical\", \"identifier\", \"period\")\n                  and p[\"nunique\"] == p.get(\"rows\") and p[\"nunique\"] <= 40), None)\n    # only put measures on one axis when they share a scale (all percentages or none)\n    same_scale = [n for n in numeric if bool(by_name[n].get(\"percent\")) == bool(by_name[numeric[0]].get(\"percent\"))] if numeric else []\n    if label and len(same_scale) >= 2:\n        out.append({\"type\": \"grouped_bar\", \"title\": f\"{', '.join(same_scale[:3])} by {label}\", \"x\": label,\n                    \"y\": \"|\".join(same_scale[:4]), \"agg\": \"sum\", \"color\": \"\", \"y2\": \"\", \"why\": \"Side-by-side comparison of each measure\"})\n\n    if date:\n        if measure:\n            out.append(C_(\"line\", f\"{'Avg ' if m_agg == 'mean' else ''}{measure} over time\", date, measure, m_agg))\n        out.append(C_(\"line\", \"Records over time\", date, \"\", \"count\"))\n        if by_name[date][\"kind\"] == \"datetime\":\n            out.append(C_(\"weekday_heatmap\", \"Activity by weekday and month\", date, measure or \"\", m_agg if measure else \"count\"))\n    m_title = f\"Avg {measure}\" if m_agg == \"mean\" else measure\n    for d in dims[:4]:\n        if measure:\n            out.append(C_(\"bar\", f\"{m_title} by {d}\", d, measure, m_agg))\n        out.append(C_(\"donut\", f\"Share of records by {d}\", d, \"\", \"count\"))\n    if dims and measure and m_agg == \"sum\":\n        out.append(C_(\"pareto\", f\"{measure} concentration by {dims[0]}\", dims[0], measure, \"sum\"))\n    if len(dims) >= 2:\n        out.append(C_(\"heatmap\", f\"{dims[0]} vs {dims[1]}\", dims[0], measure or \"\", m_agg if measure else \"count\", dims[1]))\n        out.append(C_(\"treemap\", f\"{dims[0]} and {dims[1]} breakdown\", dims[0], measure or \"\", m_agg if measure else \"count\", dims[1]))\n        if date:\n            out.append(C_(\"stacked_bar\", f\"{dims[0]} mix over time\", date, measure or \"\", m_agg if measure else \"count\", dims[0]))\n    for n in numeric[:3]:\n        out.append(C_(\"histogram\", f\"Distribution of {n}\", n, \"\", \"count\"))\n    if dims and numeric:\n        out.append(C_(\"box\", f\"{numeric[0]} spread by {dims[0]}\", dims[0], numeric[0], \"sum\"))\n    if len(numeric) >= 2:\n        out.append(C_(\"scatter\", f\"{numeric[0]} vs {numeric[1]}\", numeric[0], numeric[1], \"sum\", dims[0] if dims else \"\"))\n    return out\n\n\ndef C_(type_, title, x, y, agg, color=\"\"):\n    return {\"type\": type_, \"title\": title, \"x\": x, \"y\": y, \"agg\": agg, \"color\": color, \"y2\": \"\", \"why\": \"\"}\n\n\n# ---------- chart data ----------\n\ndef time_bucket(s: pd.Series, order=None) -> tuple:\n    \"\"\"Returns (bucketed series, label). Datetimes pick D/W/M/Q from the span; periods keep order.\"\"\"\n    if order:\n        return pd.Categorical(s, categories=order, ordered=True), \"period\"\n    span = (s.max() - s.min()).days if s.notna().any() else 0\n    freq, label = (\"D\", \"day\") if span <= 45 else (\"W\", \"week\") if span <= 200 else (\"M\", \"month\") if span <= 1100 else (\"Q\", \"quarter\")\n    return s.dt.to_period(freq).dt.start_time, label\n\n\ndef period_label(value, unit: str) -> str:\n    if not hasattr(value, \"strftime\"):\n        return str(value)\n    if unit == \"day\":\n        return f\"{value:%a %d %b %Y}\"\n    if unit == \"week\":\n        return f\"week of {value:%d %b %Y}\"\n    if unit == \"quarter\":\n        return f\"Q{(value.month - 1) // 3 + 1} {value:%Y}\"\n    return f\"{value:%b %Y}\"\n\n\ndef aggregate(df: pd.DataFrame, by, y: str, agg: str, y2: str = \"\") -> pd.DataFrame:\n    \"\"\"Group and aggregate into a tidy frame with a 'value' column.\"\"\"\n    by = [by] if isinstance(by, str) else list(by)\n    g = df.groupby(by, observed=True, dropna=True)\n    if agg == \"count\":\n        out = g.size()\n    elif agg == \"nunique\":\n        out = g[y].nunique()\n    elif agg == \"rate\":\n        out = g[y].apply(lambda s: is_truthy(s.dropna()).mean() if s.notna().any() else np.nan)\n    elif agg == \"ratio\":\n        num = g[y].sum()\n        den = g[y2].sum().replace(0, np.nan)\n        out = num / den\n    else:\n        out = getattr(g[y], agg)()\n    return out.rename(\"value\").reset_index()\n\n\ndef measure_label(spec: dict) -> str:\n    agg, y = spec[\"agg\"], spec.get(\"y\")\n    if agg == \"count\":\n        return \"Records\"\n    if agg == \"rate\":\n        return f\"{y} rate\"\n    if agg == \"ratio\":\n        return f\"{y} / {spec.get('y2')}\"\n    return {\"mean\": f\"Avg {y}\", \"median\": f\"Median {y}\", \"nunique\": f\"Unique {y}\", \"min\": f\"Min {y}\", \"max\": f\"Max {y}\"}.get(agg, y)\n\n\n# ---------- filters ----------\n\ndef filter_candidates(profiles: list, roles: dict, limit: int = 4) -> list:\n    return _usable_dims(profiles, roles, max_card=40)[:limit]\n\n\n# ---------- insights ----------\n\ndef insights(df: pd.DataFrame, plan: dict, roles: dict, profiles: list, domain: str) -> list:\n    \"\"\"Plain-English findings computed with pandas. No LLM call.\"\"\"\n    out = []\n    by_name = {p[\"name\"]: p for p in profiles}\n    measure = primary_measure(domain, roles, profiles)\n    if df.empty:\n        return [\"No rows match the current filters.\"]\n    mt = plan.get(\"metric_table\")\n    if mt and mt[\"prev\"]:\n        return _metric_table_insights(df, mt)\n    m_is_sum = bool(measure) and measure_agg(measure, roles, by_name) == \"sum\"\n\n    line_type = roles.get(\"line_type\")\n    sold = df[df[line_type] == \"Product\"] if line_type in df.columns else df\n    if line_type in df.columns and measure:\n        returns = df[df[line_type] == \"Return\"]\n        gross = pd.to_numeric(df[measure], errors=\"coerce\").clip(lower=0).sum()\n        if len(returns) and gross:\n            lost = abs(returns[measure].sum())\n            invoices = f\" across {returns[roles['order_id']].nunique()} invoices\" if \"order_id\" in roles else \"\"\n            out.append(f\"Returns and cancellations took back {fmt_value(lost, 'number')} \"\n                       f\"({lost / gross:.1%} of gross sales){invoices}.\")\n        fees = df[df[line_type] == \"Shipping & fees\"]\n        if len(fees) and gross:\n            out.append(f\"Shipping and fee lines add {fmt_value(fees[measure].sum(), 'number')} \"\n                       f\"({fees[measure].sum() / gross:.1%} of gross sales), kept out of product rankings.\")\n\n    dims = _usable_dims(profiles, roles)\n    if measure and dims and m_is_sum:\n        d = dims[0]\n        t = aggregate(sold, d, measure, \"sum\").sort_values(\"value\", ascending=False)\n        total = t[\"value\"].sum()\n        if len(t) >= 2 and total:\n            top = t.iloc[0]\n            out.append(f\"{top[d]} leads {measure} with {top['value'] / total:.0%} of the total \"\n                       f\"({fmt_value(top['value'], 'number')}), ahead of {t.iloc[1][d]} at {t.iloc[1]['value'] / total:.0%}.\")\n            cum = t[\"value\"].cumsum() / total\n            k = int((cum < 0.8).sum()) + 1\n            if len(t) >= 5:\n                noun = DIM_NOUNS.get({v: r for r, v in roles.items()}.get(d), f\"{d} values\")\n                out.append(f\"{k} of {len(t)} {noun} ({k / len(t):.0%}) make up 80% of {measure}.\")\n\n    date = roles.get(\"date\")\n    if date and date in df.columns and measure:\n        s = df[[date, measure]].dropna()\n        if len(s):\n            order = by_name.get(date, {}).get(\"period_order\")\n            bucket, label = time_bucket(s[date], order)\n            series = s.assign(_b=bucket).groupby(\"_b\", observed=True)[measure].agg(\"sum\" if m_is_sum else \"mean\")\n            if label == \"month\" and s[date].max().day < 25:\n                series = series.iloc[:-1]  # latest month still running\n            if len(series) >= 2:\n                last, prev = series.iloc[-1], series.iloc[-2]\n                if prev and label != \"day\":  # day-to-day swings are mostly noise\n                    change = (last - prev) / abs(prev)\n                    word = \"rose\" if change > 0 else \"fell\"\n                    out.append(f\"{measure} {word} {abs(change):.1%} in the latest {label} compared with the one before.\")\n                peak = series.idxmax()\n                peak_label = period_label(peak, label)\n                out.append(f\"Peak {label} for {measure}: {peak_label} ({fmt_value(series.max(), 'number')}).\")\n\n    for c in plan[\"charts\"]:\n        if c[\"agg\"] in (\"mean\", \"rate\", \"ratio\") and c[\"type\"] == \"bar\":\n            t = aggregate(df, c[\"x\"], c[\"y\"], c[\"agg\"], c.get(\"y2\", \"\")).dropna().sort_values(\"value\")\n            if len(t) >= 3:\n                fmt = \"percent\" if c[\"agg\"] in (\"rate\", \"ratio\") else \"number\"\n                out.append(f\"{measure_label(c)} is highest for {t.iloc[-1][c['x']]} ({fmt_value(t.iloc[-1]['value'], fmt)}) \"\n                           f\"and lowest for {t.iloc[0][c['x']]} ({fmt_value(t.iloc[0]['value'], fmt)}).\")\n            if len(out) >= 5:\n                break\n\n    if measure and not m_is_sum and dims:\n        t = aggregate(df, dims[0], measure, \"mean\").dropna().sort_values(\"value\")\n        if len(t) >= 3:\n            out.append(f\"Avg {measure} is highest for {t.iloc[-1][dims[0]]} ({fmt_value(t.iloc[-1]['value'], 'number')}) \"\n                       f\"and lowest for {t.iloc[0][dims[0]]} ({fmt_value(t.iloc[0]['value'], 'number')}).\")\n\n    gaps = [p[\"name\"] for p in profiles if p[\"nulls_pct\"] >= 20]\n    if gaps:\n        out.append(f\"Data gaps: {', '.join(gaps[:4])} {'is' if len(gaps) == 1 else 'are'} at least 20% empty, so read related charts with care.\")\n    return list(dict.fromkeys(out))[:6]\n\n\ndef _metric_table_insights(df, mt) -> list:\n    d = df[[mt[\"label\"], mt[\"prev\"], mt[\"latest\"]] + ([mt[\"better\"]] if mt[\"better\"] else [])].copy()\n    d[\"_prev\"] = pd.to_numeric(d[mt[\"prev\"]], errors=\"coerce\")\n    d[\"_cur\"] = pd.to_numeric(d[mt[\"latest\"]], errors=\"coerce\")\n    d = d.dropna(subset=[\"_prev\", \"_cur\"])\n    d[\"_pct\"] = (d[\"_cur\"] - d[\"_prev\"]) / d[\"_prev\"].abs().replace(0, np.nan)\n    out = []\n    for _, r in d.reindex(d[\"_pct\"].abs().sort_values(ascending=False).index).head(4).iterrows():\n        if pd.isna(r[\"_pct\"]) or r[\"_pct\"] == 0:\n            continue\n        direction = \"up\" if r[\"_pct\"] > 0 else \"down\"\n        verdict = \"\"\n        if mt[\"better\"] and pd.notna(r[mt[\"better\"]]):\n            good = (r[\"_pct\"] < 0) == (\"lower\" in str(r[mt[\"better\"]]).lower())\n            verdict = \", an improvement\" if good else \", a decline worth a look\"\n        out.append(f\"{r[mt['label']]} is {direction} {abs(r['_pct']):.0%} ({fmt_value(r['_prev'], 'number')} in {mt['prev']} \"\n                   f\"to {fmt_value(r['_cur'], 'number')} in {mt['latest']}){verdict}.\")\n    flat = d[d[\"_pct\"] == 0][mt[\"label\"]].astype(str).tolist()\n    if flat:\n        out.append(f\"No movement on {', '.join(flat[:3])}.\")\n    return out\n",
        "insight_app/kpi_library.py": "\"\"\"Domain KPI and chart templates. \"@role\" is swapped for the mapped column at run time; a spec\nwhose roles are missing is skipped. KPIs sharing a \"group\" are alternatives: first one that\nresolves wins.\n\nKPI aggs:   sum, mean, median, min, max, count_rows, nunique, ratio_sum (sum col / sum column2),\n            per_unique (sum col / unique column2), share_true, share_value (rows where col matches\n            filter_value, a regex), share_of_gross (|sum col over the where-rows| / sum of positive col),\n            repeat_rate (share of col values with more than one distinct column2), sum_abs\nRow filter (KPIs and charts): where_column + where_value (regex) + where_not. Optional: dropped when\n            the column is missing, unless a chart sets where_required.\nChart types: line, bar, donut, stacked_bar, treemap, heatmap, pareto, histogram, box, scatter,\n            waterfall, funnel, weekday_heatmap, grouped_bar, metric_funnel\nChart aggs:  sum, mean, median, count, nunique, rate (share of truthy y), ratio (sum y / sum y2), min, max\nA histogram with `color` first sums x per color value (e.g. order value per invoice).\n\"\"\"\n\nKPI_AGGS = [\"sum\", \"mean\", \"median\", \"min\", \"max\", \"count_rows\", \"nunique\", \"ratio_sum\", \"per_unique\",\n            \"share_true\", \"share_value\", \"share_of_gross\", \"repeat_rate\", \"sum_abs\"]\nCHART_TYPES = [\"line\", \"bar\", \"donut\", \"stacked_bar\", \"treemap\", \"heatmap\", \"pareto\", \"histogram\", \"box\",\n               \"scatter\", \"waterfall\", \"funnel\", \"weekday_heatmap\", \"grouped_bar\", \"metric_funnel\"]\nCHART_AGGS = [\"sum\", \"mean\", \"median\", \"count\", \"nunique\", \"rate\", \"ratio\", \"min\", \"max\"]\nFORMATS = [\"auto\", \"number\", \"currency\", \"percent\", \"decimal\", \"multiple\"]\n\nTAB_OF = {\n    \"line\": \"Overview\", \"bar\": \"Overview\", \"donut\": \"Overview\", \"stacked_bar\": \"Overview\", \"funnel\": \"Overview\",\n    \"metric_funnel\": \"Overview\", \"grouped_bar\": \"Overview\",\n    \"treemap\": \"Breakdown\", \"heatmap\": \"Breakdown\", \"pareto\": \"Breakdown\", \"waterfall\": \"Breakdown\",\n    \"weekday_heatmap\": \"Breakdown\",\n    \"histogram\": \"Distribution\", \"box\": \"Distribution\", \"scatter\": \"Distribution\",\n}\n\n\ndef K(title, agg, column=\"\", column2=\"\", filter_value=\"\", fmt=\"auto\", why=\"\", group=None, **extra):\n    return {\"title\": title, \"agg\": agg, \"column\": column, \"column2\": column2, \"filter_value\": filter_value,\n            \"fmt\": fmt, \"why\": why, \"group\": group or title, **extra}\n\n\ndef C(type_, title, x=\"\", y=\"\", agg=\"sum\", color=\"\", y2=\"\", why=\"\", **extra):\n    return {\"type\": type_, \"title\": title, \"x\": x, \"y\": y, \"agg\": agg, \"color\": color, \"y2\": y2, \"why\": why, **extra}\n\n\n# order lines that are not returns / cancellations\nNOT_RETURN = {\"where_column\": \"@line_type\", \"where_value\": \"return\", \"where_not\": True}\nONLY_PRODUCTS = {\"where_column\": \"@line_type\", \"where_value\": \"product\"}\nONLY_RETURNS = {\"where_column\": \"@line_type\", \"where_value\": \"return\", \"where_required\": True}\n\nKPI_TEMPLATES = {\n    \"Sales\": [\n        K(\"Net Revenue\", \"sum\", \"@revenue\", fmt=\"currency\", why=\"Sales after returns and cancellations\",\n          group=\"revenue\", requires=[\"@line_type\"]),\n        K(\"Total Revenue\", \"sum\", \"@revenue\", fmt=\"currency\", why=\"Top-line sales value\", group=\"revenue\"),\n        K(\"Orders\", \"nunique\", \"@order_id\", group=\"volume\", why=\"Distinct invoices, cancellations excluded\", **NOT_RETURN),\n        K(\"Transactions\", \"count_rows\", group=\"volume\"),\n        K(\"Avg Order Value\", \"per_unique\", \"@revenue\", \"@order_id\", fmt=\"currency\", group=\"aov\",\n          why=\"Revenue per invoice, cancellations excluded\", **NOT_RETURN),\n        K(\"Avg Sale Value\", \"mean\", \"@revenue\", fmt=\"currency\", group=\"aov\"),\n        K(\"Customers\", \"nunique\", \"@customer\", why=\"Distinct buying customers\", **NOT_RETURN),\n        K(\"Gross Profit\", \"sum\", \"@profit\", fmt=\"currency\"),\n        K(\"Profit Margin\", \"ratio_sum\", \"@profit\", \"@revenue\", fmt=\"percent\"),\n        K(\"Return Rate\", \"share_of_gross\", \"@revenue\", fmt=\"percent\", lower_better=True, requires=[\"@line_type\"],\n          why=\"Value returned or cancelled, as a share of gross sales\", where_column=\"@line_type\", where_value=\"return\"),\n        K(\"Units Sold\", \"sum\", \"@quantity\", fmt=\"number\", **NOT_RETURN),\n        K(\"Repeat Customers\", \"repeat_rate\", \"@customer\", \"@order_id\", fmt=\"percent\",\n          why=\"Customers with more than one order\", **NOT_RETURN),\n        K(\"Units per Order\", \"per_unique\", \"@quantity\", \"@order_id\", fmt=\"decimal\", why=\"Average basket size\", **NOT_RETURN),\n        K(\"Target Achieved\", \"ratio_sum\", \"@revenue\", \"@target\", fmt=\"percent\"),\n        K(\"Avg Discount\", \"mean\", \"@discount\"),\n        K(\"Products Sold\", \"nunique\", \"@product\", **ONLY_PRODUCTS),\n    ],\n    \"HR\": [\n        K(\"Headcount\", \"nunique\", \"@employee_id\", group=\"headcount\"),\n        K(\"Headcount\", \"count_rows\", group=\"headcount\"),\n        K(\"Avg Salary\", \"mean\", \"@salary\", fmt=\"currency\"),\n        K(\"Total Payroll\", \"sum\", \"@salary\", fmt=\"currency\"),\n        K(\"Attrition Rate\", \"share_true\", \"@attrition\", fmt=\"percent\"),\n        K(\"Avg Tenure\", \"mean\", \"@tenure\", fmt=\"decimal\"),\n        K(\"Avg Age\", \"mean\", \"@age\", fmt=\"decimal\"),\n        K(\"Women in Workforce\", \"share_value\", \"@gender\", filter_value=\"f|female|woman|women\", fmt=\"percent\"),\n        K(\"Avg Rating\", \"mean\", \"@rating\", fmt=\"decimal\"),\n        K(\"Departments\", \"nunique\", \"@department\"),\n        K(\"Locations\", \"nunique\", \"@region\"),\n        K(\"Job Roles\", \"nunique\", \"@job\"),\n    ],\n    \"Customer Support\": [\n        K(\"Tickets\", \"sum\", \"@tickets\", group=\"tickets\"),\n        K(\"Tickets\", \"nunique\", \"@ticket_id\", group=\"tickets\"),\n        K(\"Tickets\", \"count_rows\", group=\"tickets\"),\n        K(\"Avg Resolution Time\", \"mean\", \"@resolution_time\", fmt=\"decimal\"),\n        K(\"CSAT\", \"mean\", \"@csat\"),\n        K(\"SLA Met\", \"share_true\", \"@sla_met\", fmt=\"percent\"),\n        K(\"High Priority Share\", \"share_value\", \"@priority\", filter_value=\"high|urgent|critical|p1|p0\", fmt=\"percent\"),\n        K(\"Agents\", \"nunique\", \"@agent\"),\n        K(\"Tickets per Agent\", \"per_unique\", \"@tickets\", \"@agent\", fmt=\"decimal\"),\n    ],\n    \"Marketing\": [\n        K(\"Spend\", \"sum\", \"@cost\", fmt=\"currency\"),\n        K(\"Impressions\", \"sum\", \"@impressions\"),\n        K(\"Clicks\", \"sum\", \"@clicks\"),\n        K(\"CTR\", \"ratio_sum\", \"@clicks\", \"@impressions\", fmt=\"percent\"),\n        K(\"Conversions\", \"sum\", \"@conversions\"),\n        K(\"Conversion Rate\", \"ratio_sum\", \"@conversions\", \"@clicks\", fmt=\"percent\"),\n        K(\"Cost per Conversion\", \"ratio_sum\", \"@cost\", \"@conversions\", fmt=\"currency\"),\n        K(\"Revenue\", \"sum\", \"@revenue\", fmt=\"currency\"),\n        K(\"ROAS\", \"ratio_sum\", \"@revenue\", \"@cost\", fmt=\"multiple\"),\n        K(\"Campaigns\", \"nunique\", \"@product\"),\n    ],\n    \"Finance\": [\n        K(\"Revenue\", \"sum\", \"@revenue\", fmt=\"currency\"),\n        K(\"Expenses\", \"sum\", \"@cost\", fmt=\"currency\"),\n        K(\"Profit\", \"sum\", \"@profit\", fmt=\"currency\"),\n        K(\"Margin\", \"ratio_sum\", \"@profit\", \"@revenue\", fmt=\"percent\"),\n        K(\"Budget\", \"sum\", \"@target\", fmt=\"currency\"),\n        K(\"Spend vs Budget\", \"ratio_sum\", \"@cost\", \"@target\", fmt=\"percent\"),\n        K(\"Accounts\", \"nunique\", \"@customer\"),\n    ],\n    \"Operations / Inventory\": [\n        K(\"Stock on Hand\", \"sum\", \"@stock\"),\n        K(\"Units\", \"sum\", \"@quantity\"),\n        K(\"SKUs\", \"nunique\", \"@product\"),\n        K(\"Inventory Cost\", \"sum\", \"@cost\", fmt=\"currency\"),\n        K(\"Locations\", \"nunique\", \"@region\"),\n        K(\"Avg Unit Price\", \"mean\", \"@unit_price\", fmt=\"currency\"),\n    ],\n    \"Education\": [\n        K(\"Students\", \"nunique\", \"@customer\", group=\"students\"),\n        K(\"Records\", \"count_rows\", group=\"students\"),\n        K(\"Avg Score\", \"mean\", \"@rating\", fmt=\"decimal\"),\n        K(\"Courses\", \"nunique\", \"@product\"),\n        K(\"Classes\", \"nunique\", \"@category\"),\n    ],\n    \"Healthcare\": [\n        K(\"Patients\", \"nunique\", \"@customer\", group=\"patients\"),\n        K(\"Records\", \"count_rows\", group=\"patients\"),\n        K(\"Total Cost\", \"sum\", \"@cost\", fmt=\"currency\"),\n        K(\"Revenue\", \"sum\", \"@revenue\", fmt=\"currency\"),\n        K(\"Departments\", \"nunique\", \"@department\"),\n    ],\n    \"Generic\": [],\n}\n\nCHART_TEMPLATES = {\n    \"Sales\": [\n        C(\"line\", \"Revenue trend\", \"@date\", \"@revenue\", why=\"How sales move over time\"),\n        C(\"bar\", \"Top products by revenue\", \"@product\", \"@revenue\", why=\"Which products earn the most\", **ONLY_PRODUCTS),\n        C(\"bar\", \"Top products by units\", \"@product\", \"@quantity\", why=\"Which products move the most volume\", **ONLY_PRODUCTS),\n        C(\"pareto\", \"Customer concentration (80/20)\", \"@customer\", \"@revenue\", why=\"How few customers drive most revenue\", **NOT_RETURN),\n        C(\"donut\", \"Revenue share by region\", \"@region\", \"@revenue\", why=\"Where sales come from\", **NOT_RETURN),\n        C(\"donut\", \"Revenue by channel\", \"@channel\", \"@revenue\", **NOT_RETURN),\n        C(\"bar\", \"Sales rep leaderboard\", \"@salesperson\", \"@revenue\", why=\"Revenue closed by each rep\"),\n        C(\"bar\", \"Profit margin by category\", \"@category\", \"@profit\", agg=\"ratio\", y2=\"@revenue\", why=\"Profit as a share of revenue\"),\n        C(\"bar\", \"Revenue by line type\", \"@line_type\", \"@revenue\", why=\"Products vs shipping and fees, with returns netted off\"),\n        C(\"stacked_bar\", \"Revenue by category over time\", \"@date\", \"@revenue\", color=\"@category\"),\n        C(\"treemap\", \"Revenue by region and product\", \"@region\", \"@revenue\", color=\"@product\", **NOT_RETURN),\n        C(\"heatmap\", \"Revenue: region vs category\", \"@region\", \"@revenue\", color=\"@category\"),\n        C(\"weekday_heatmap\", \"When sales happen\", \"@date\", \"@revenue\", why=\"Busy days and hours (months for longer ranges)\", **NOT_RETURN),\n        C(\"bar\", \"Most returned products\", \"@product\", agg=\"count\", why=\"Products on the most cancelled lines\", **ONLY_RETURNS),\n        C(\"waterfall\", \"Revenue to profit bridge\", \"@revenue\", \"@cost\", y2=\"@profit\"),\n        C(\"funnel\", \"Pipeline by stage\", \"@stage\", \"@revenue\"),\n        C(\"histogram\", \"Order value distribution\", \"@revenue\", color=\"@order_id\", why=\"Spread of invoice totals\", **NOT_RETURN),\n        C(\"scatter\", \"Unit price vs quantity\", \"@unit_price\", \"@quantity\", why=\"Do cheaper items sell in bigger quantities?\", **ONLY_PRODUCTS),\n        C(\"scatter\", \"Discount vs profit\", \"@discount\", \"@profit\", color=\"@category\", why=\"Does discounting hurt profit?\"),\n        C(\"box\", \"Sale value spread by region\", \"@region\", \"@revenue\"),\n    ],\n    \"HR\": [\n        C(\"bar\", \"Headcount by department\", \"@department\", agg=\"count\"),\n        C(\"bar\", \"Avg salary by department\", \"@department\", \"@salary\", agg=\"mean\"),\n        C(\"bar\", \"Avg salary by job role\", \"@job\", \"@salary\", agg=\"mean\"),\n        C(\"donut\", \"Gender mix\", \"@gender\", agg=\"count\"),\n        C(\"donut\", \"Headcount by location\", \"@region\", agg=\"count\"),\n        C(\"bar\", \"Attrition rate by department\", \"@department\", \"@attrition\", agg=\"rate\", why=\"Share of people who left\"),\n        C(\"line\", \"Hiring trend\", \"@hire_date\", agg=\"count\"),\n        C(\"line\", \"Exits over time\", \"@exit_date\", agg=\"count\"),\n        C(\"stacked_bar\", \"Gender mix by department\", \"@department\", color=\"@gender\", agg=\"count\"),\n        C(\"treemap\", \"Workforce by department and role\", \"@department\", agg=\"count\", color=\"@job\"),\n        C(\"heatmap\", \"Ratings across departments\", \"@department\", agg=\"count\", color=\"@rating\"),\n        C(\"histogram\", \"Salary bands\", \"@salary\"),\n        C(\"histogram\", \"Tenure bands\", \"@tenure\"),\n        C(\"box\", \"Salary spread by department\", \"@department\", \"@salary\"),\n        C(\"box\", \"Salary spread by location\", \"@region\", \"@salary\"),\n        C(\"scatter\", \"Tenure vs salary\", \"@tenure\", \"@salary\", color=\"@department\"),\n    ],\n    \"Customer Support\": [\n        C(\"line\", \"Ticket volume trend\", \"@date\", \"@tickets\"),\n        C(\"line\", \"Ticket volume trend\", \"@date\", agg=\"count\"),\n        C(\"line\", \"CSAT trend\", \"@date\", \"@csat\", agg=\"mean\"),\n        C(\"line\", \"Resolution time trend\", \"@date\", \"@resolution_time\", agg=\"mean\"),\n        C(\"bar\", \"Tickets by agent\", \"@agent\", \"@tickets\"),\n        C(\"bar\", \"Tickets by agent\", \"@agent\", agg=\"count\"),\n        C(\"bar\", \"Avg resolution time by agent\", \"@agent\", \"@resolution_time\", agg=\"mean\"),\n        C(\"bar\", \"CSAT by agent\", \"@agent\", \"@csat\", agg=\"mean\"),\n        C(\"donut\", \"Tickets by priority\", \"@priority\", agg=\"count\"),\n        C(\"donut\", \"Tickets by category\", \"@category\", agg=\"count\"),\n        C(\"donut\", \"Ticket status\", \"@status\", agg=\"count\"),\n        C(\"heatmap\", \"Category vs priority\", \"@category\", agg=\"count\", color=\"@priority\"),\n        C(\"weekday_heatmap\", \"Tickets by weekday and month\", \"@date\", agg=\"count\"),\n        C(\"histogram\", \"Resolution time distribution\", \"@resolution_time\"),\n        C(\"box\", \"Resolution time by priority\", \"@priority\", \"@resolution_time\"),\n        C(\"scatter\", \"Resolution time vs CSAT\", \"@resolution_time\", \"@csat\", color=\"@agent\"),\n    ],\n    \"Marketing\": [\n        C(\"line\", \"Spend trend\", \"@date\", \"@cost\"),\n        C(\"line\", \"Conversions trend\", \"@date\", \"@conversions\"),\n        C(\"bar\", \"Conversions by channel\", \"@channel\", \"@conversions\"),\n        C(\"bar\", \"Conversion rate by channel\", \"@channel\", \"@conversions\", agg=\"ratio\", y2=\"@clicks\"),\n        C(\"donut\", \"Spend by channel\", \"@channel\", \"@cost\"),\n        C(\"bar\", \"Top campaigns by conversions\", \"@product\", \"@conversions\"),\n        C(\"metric_funnel\", \"Impressions to conversions\", \"@impressions\", \"@clicks\", y2=\"@conversions\"),\n        C(\"scatter\", \"Spend vs conversions\", \"@cost\", \"@conversions\", color=\"@channel\"),\n        C(\"pareto\", \"Campaign concentration\", \"@product\", \"@conversions\"),\n    ],\n    \"Finance\": [\n        C(\"line\", \"Revenue trend\", \"@date\", \"@revenue\"),\n        C(\"line\", \"Expense trend\", \"@date\", \"@cost\"),\n        C(\"bar\", \"Expenses by category\", \"@category\", \"@cost\"),\n        C(\"bar\", \"Revenue by account\", \"@customer\", \"@revenue\"),\n        C(\"donut\", \"Expense mix\", \"@category\", \"@cost\"),\n        C(\"waterfall\", \"Revenue to profit bridge\", \"@revenue\", \"@cost\", y2=\"@profit\"),\n        C(\"pareto\", \"Expense concentration\", \"@category\", \"@cost\"),\n    ],\n    \"Operations / Inventory\": [\n        C(\"bar\", \"Stock by product\", \"@product\", \"@stock\"),\n        C(\"bar\", \"Stock by location\", \"@region\", \"@stock\"),\n        C(\"donut\", \"Stock by category\", \"@category\", \"@stock\"),\n        C(\"line\", \"Units trend\", \"@date\", \"@quantity\"),\n        C(\"pareto\", \"Stock concentration\", \"@product\", \"@stock\"),\n        C(\"histogram\", \"Stock level distribution\", \"@stock\"),\n    ],\n    \"Education\": [\n        C(\"bar\", \"Avg score by course\", \"@product\", \"@rating\", agg=\"mean\"),\n        C(\"bar\", \"Avg score by class\", \"@category\", \"@rating\", agg=\"mean\"),\n        C(\"histogram\", \"Score distribution\", \"@rating\"),\n        C(\"box\", \"Score spread by course\", \"@product\", \"@rating\"),\n    ],\n    \"Healthcare\": [\n        C(\"line\", \"Patient volume trend\", \"@date\", agg=\"count\"),\n        C(\"bar\", \"Patients by department\", \"@department\", agg=\"count\"),\n        C(\"bar\", \"Cost by department\", \"@department\", \"@cost\"),\n        C(\"histogram\", \"Cost distribution\", \"@cost\"),\n    ],\n    \"Generic\": [],\n}\n",
        "insight_app/loaders.py": "\"\"\"Read Excel / CSV / Word / PDF uploads into clean pandas tables.\n\nOne sheet can hold several tables (title rows, blank-row gaps, notes underneath). Every sheet or\ndocument is split into blocks on fully empty rows, each block gets its real header row detected,\nand note lines and total rows are dropped so they never double-count.\n\"\"\"\n\nimport io\nimport re\n\nimport pandas as pd\n\nTOTAL_ROW = re.compile(r\"^\\s*(grand\\s+)?(total|sum|overall|subtotal)\\b|\\btotal\\s*/\\s*avg\\b|^\\s*q\\d\\s+total\", re.I)\n\n\ndef load_file(name: str, data: bytes) -> dict:\n    \"\"\"Returns {table_label: DataFrame}, largest table first. Raises ValueError if nothing usable.\"\"\"\n    ext = name.lower().rsplit(\".\", 1)[-1]\n    if ext == \"csv\":\n        raws = {\"CSV\": _read_csv_raw(data)}\n    elif ext in (\"xlsx\", \"xlsm\", \"xls\"):\n        raws = pd.read_excel(io.BytesIO(data), sheet_name=None, header=None)\n    elif ext == \"docx\":\n        raws = _read_docx_raw(data)\n    elif ext == \"pdf\":\n        raws = _read_pdf_raw(data)\n    else:\n        raise ValueError(f\"Unsupported file type: .{ext}\")\n\n    tables = {}\n    for label, raw in raws.items():\n        blocks = _split_blocks(raw)\n        for i, block in enumerate(blocks, start=1):\n            df = _apply_header(block)\n            if df is None:\n                continue\n            key = label if len(blocks) == 1 else f\"{label} - table {i} ({df.columns[0]})\"\n            tables[key] = df\n\n    if not tables:\n        raise ValueError(\"No table with a header row and at least two data rows was found in this file.\")\n    return dict(sorted(tables.items(), key=lambda kv: kv[1].size, reverse=True))\n\n\ndef _read_csv_raw(data: bytes) -> pd.DataFrame:\n    for enc in (\"utf-8-sig\", \"latin-1\"):\n        try:\n            return pd.read_csv(io.BytesIO(data), header=None, sep=None, engine=\"python\", encoding=enc)\n        except UnicodeDecodeError:\n            continue\n    raise ValueError(\"Couldn't decode this CSV file.\")\n\n\ndef _read_docx_raw(data: bytes) -> dict:\n    from docx import Document\n\n    doc = Document(io.BytesIO(data))\n    raws = {}\n    for i, table in enumerate(doc.tables, start=1):\n        rows = []\n        for row in table.rows:\n            cells = [cell.text.strip() for cell in row.cells]\n            # merged cells repeat their text in every grid slot; keep it once\n            if len(cells) > 1 and len(set(cells)) == 1:\n                cells = [cells[0]] + [\"\"] * (len(cells) - 1)\n            rows.append(cells)\n        if rows:\n            raws[f\"Word table {i}\"] = pd.DataFrame(rows).replace(\"\", None)\n    if not raws:\n        raise ValueError(\"This Word document has no tables. Add the data as a table and upload again.\")\n    return raws\n\n\ndef _read_pdf_raw(data: bytes) -> dict:\n    import pdfplumber\n\n    raws, current, width = {}, [], None\n    with pdfplumber.open(io.BytesIO(data)) as pdf:\n        for page in pdf.pages:\n            for table in page.extract_tables():\n                rows = [[(c or \"\").strip() for c in row] for row in table if row]\n                if not rows:\n                    continue\n                # a table that continues on the next page keeps its width; repeated headers are dropped\n                if current and len(rows[0]) == width:\n                    if rows[0] == current[0]:\n                        rows = rows[1:]\n                    current.extend(rows)\n                else:\n                    if current:\n                        raws[f\"PDF table {len(raws) + 1}\"] = pd.DataFrame(current).replace(\"\", None)\n                    current, width = rows, len(rows[0])\n    if current:\n        raws[f\"PDF table {len(raws) + 1}\"] = pd.DataFrame(current).replace(\"\", None)\n    if not raws:\n        raise ValueError(\"No tables found in this PDF. Scanned PDFs need OCR first.\")\n    return raws\n\n\ndef _split_blocks(raw: pd.DataFrame) -> list:\n    raw = raw.dropna(axis=1, how=\"all\")\n    if raw.empty:\n        return []\n    empty = raw.isna().all(axis=1).to_numpy()\n    blocks, start = [], None\n    for i, is_empty in enumerate(empty):\n        if not is_empty and start is None:\n            start = i\n        elif is_empty and start is not None:\n            blocks.append(raw.iloc[start:i])\n            start = None\n    if start is not None:\n        blocks.append(raw.iloc[start:])\n    return [b.dropna(axis=1, how=\"all\") for b in blocks]\n\n\ndef _is_label(value) -> bool:\n    if value is None or (isinstance(value, float) and pd.isna(value)):\n        return False\n    if isinstance(value, (int, float, pd.Timestamp)):\n        return False\n    text = str(value).strip()\n    return bool(text) and not re.fullmatch(r\"[-+$\u20b9\u20ac\u00a3%.,\\d\\s]+\", text)\n\n\ndef _apply_header(block: pd.DataFrame):\n    width = block.shape[1]\n    if width < 2:\n        return None\n    header_idx = None\n    for i in range(min(len(block), 15)):\n        row = block.iloc[i].tolist()\n        filled = sum(v is not None and not (isinstance(v, float) and pd.isna(v)) for v in row)\n        labels = sum(_is_label(v) for v in row)\n        if filled >= max(2, 0.6 * width) and labels >= 0.6 * filled:\n            header_idx = i\n            break\n    if header_idx is None:\n        return None\n\n    names, seen = [], {}\n    for j, v in enumerate(block.iloc[header_idx].tolist()):\n        name = str(v).strip() if _is_label(v) or (v is not None and not pd.isna(v)) else f\"Column {j + 1}\"\n        name = re.sub(r\"\\s+\", \" \", name)\n        seen[name] = seen.get(name, 0) + 1\n        names.append(name if seen[name] == 1 else f\"{name} ({seen[name]})\")\n\n    df = block.iloc[header_idx + 1 :].copy()\n    df.columns = names\n    df = df.dropna(axis=1, how=\"all\")\n    if df.shape[1] < 2:\n        return None\n    # note lines: a single filled cell in a wide table\n    if df.shape[1] >= 3:\n        df = df[df.notna().sum(axis=1) > 1]\n    first = df.iloc[:, 0].astype(str)\n    df = df[~first.str.match(TOTAL_ROW)]\n    df = df.reset_index(drop=True)\n    if len(df) < 2:\n        return None\n    return df.infer_objects()\n",
        "insight_app/profiler.py": "\"\"\"Pandas-only column typing: turns raw cells into numbers/dates and describes every column.\"\"\"\n\nimport re\n\nimport pandas as pd\n\nMONTH_NAMES = [\"january\", \"february\", \"march\", \"april\", \"may\", \"june\", \"july\", \"august\",\n               \"september\", \"october\", \"november\", \"december\"]\nMONTH_LOOKUP = {m: i for i, m in enumerate(MONTH_NAMES, start=1)} | {m[:3]: i for i, m in enumerate(MONTH_NAMES, start=1)}\nQUARTER = re.compile(r\"^(q[1-4])(\\s*[-' ]?\\s*(\\d{2}|\\d{4}))?$\", re.I)\nNUMERIC_CELL = re.compile(r\"^\\s*\\(?\\s*[-+]?\\s*[$\u20b9\u20ac\u00a3\u00a5]?\\s*[-+]?[\\d,]*\\.?\\d+\\s*\\)?\\s*(%|[a-zA-Z]{1,6}\\.?)?\\s*$\")\nCURRENCY = re.compile(r\"[$\u20b9\u20ac\u00a3\u00a5]\")\nID_HINT = re.compile(r\"(\\bid\\b|\\b(no\\.?|num|number|#)$|\\bcode\\b|#|\\bsku\\b|\\bzip\\b|\\bpin\\s*code\\b|\\bphone\\b)\", re.I)\nDATE_HINT = re.compile(r\"(date|time|day|month|year|period|dob|joined|created|updated|on$|_at$)\", re.I)\n\n\ndef name_words(col) -> str:\n    \"\"\"'InvoiceNo' -> 'Invoice No', 'CustomerID' -> 'Customer ID', 'unit_price' -> 'unit price',\n    so name rules work on CamelCase and snake_case headers.\"\"\"\n    s = re.sub(r\"(?<=[a-z0-9])(?=[A-Z])\", \" \", str(col))\n    s = re.sub(r\"(?<=[A-Z])(?=[A-Z][a-z])\", \" \", s)\n    return re.sub(r\"[_\\s]+\", \" \", s).strip()\nTRUTHY = {\"yes\", \"y\", \"true\", \"1\", \"active\", \"left\", \"churned\", \"exited\"}\nBOOL_VALUES = {\"yes\", \"no\", \"y\", \"n\", \"true\", \"false\", \"0\", \"1\"}\n\n\ndef clean_types(df: pd.DataFrame) -> tuple:\n    \"\"\"Returns (typed_df, meta) where meta[col] has currency/percent/unit/period-order hints.\"\"\"\n    df = df.copy()\n    meta = {}\n    for col in df.columns:\n        s = df[col]\n        info = {}\n        if s.dtype == object or pd.api.types.is_string_dtype(s):\n            s = s.astype(object)\n            s = s.map(lambda v: v.strip() if isinstance(v, str) else v).replace({\"\": None, \"-\": None, \"NA\": None, \"N/A\": None, \"n/a\": None})\n            non_null = s.dropna()\n            as_text = non_null.astype(str)\n            words = name_words(col)\n            if ID_HINT.search(words):\n                # codes like 536527 / C536379 / 85123A stay text, so the C prefix (cancellation) survives\n                s = s.map(lambda v: str(int(v)) if isinstance(v, float) and v.is_integer() else (str(v) if v is not None else None))\n            elif len(non_null) and as_text.str.match(NUMERIC_CELL).mean() >= 0.9:\n                info[\"currency\"] = bool(as_text.str.contains(CURRENCY).mean() > 0.5)\n                info[\"percent\"] = bool(as_text.str.contains(\"%\").mean() > 0.5)\n                units = as_text.str.extract(r\"([a-zA-Z]{1,6})\\.?\\s*$\")[0].dropna()\n                if len(units) and units.str.lower().nunique() == 1:\n                    info[\"unit\"] = units.iloc[0]\n                negative = as_text.str.match(r\"^\\s*\\(.*\\)\\s*$\")\n                nums = pd.to_numeric(as_text.str.replace(r\"[^\\d.\\-+]\", \"\", regex=True), errors=\"coerce\")\n                nums[negative] = -nums[negative].abs()\n                s = nums.reindex(s.index)\n            elif len(non_null) and _month_order(as_text) is not None:\n                info[\"period_order\"] = _month_order(as_text)\n            elif len(non_null) and as_text.str.match(QUARTER).mean() >= 0.9:\n                info[\"period_order\"] = sorted(as_text.unique(), key=_quarter_key)\n            elif len(non_null) and (DATE_HINT.search(words) or as_text.str.match(r\"^\\d{1,4}[-/.]\\d{1,2}[-/.]\\d{1,4}\").mean() > 0.8):\n                parsed = pd.to_datetime(s, errors=\"coerce\", format=\"mixed\", dayfirst=False)\n                if parsed.notna().sum() >= 0.9 * len(non_null):\n                    s = parsed\n        elif pd.api.types.is_numeric_dtype(s) and not pd.api.types.is_bool_dtype(s) and ID_HINT.search(name_words(col)) \\\n                and s.dropna().apply(lambda v: float(v).is_integer()).all():\n            # numeric codes (customer id, invoice no) are labels, never summed\n            s = s.map(lambda v: str(int(v)) if pd.notna(v) else None).astype(object)\n        elif pd.api.types.is_numeric_dtype(s) and not pd.api.types.is_bool_dtype(s):\n            # 0..1 fractions in a column whose name says percent read better as %\n            if re.search(r\"(%|percent|rate|ratio|share|csat|margin)\", name_words(col), re.I) and s.dropna().between(0, 1).all():\n                info[\"percent_fraction\"] = True\n            if re.search(r\"(revenue|sales|amount|price|cost|salary|ctc|profit|spend|budget|value|income|expense|pay)\", name_words(col), re.I) \\\n                    and not ID_HINT.search(name_words(col)):\n                info[\"currency\"] = True\n        df[col] = s\n        meta[col] = info\n    return df, meta\n\n\ndef _month_order(values: pd.Series):\n    lowered = values.str.lower().str.strip()\n    if lowered.isin(MONTH_LOOKUP.keys()).mean() >= 0.9:\n        return sorted(values.unique(), key=lambda v: MONTH_LOOKUP.get(str(v).lower().strip(), 99))\n    return None\n\n\ndef _quarter_key(v: str):\n    m = QUARTER.match(str(v).strip())\n    year = int(m.group(3)) if m and m.group(3) else 0\n    return (year, str(v).strip().upper()[:2])\n\n\ndef profile(df: pd.DataFrame, meta: dict) -> list:\n    \"\"\"One dict per column: name, kind, stats, samples. kind is one of\n    numeric, datetime, period, boolean, categorical, identifier, text.\"\"\"\n    rows = len(df)\n    out = []\n    for col in df.columns:\n        s = df[col]\n        non_null = s.dropna()\n        nunique = int(non_null.nunique())\n        info = {\n            \"name\": col,\n            \"rows\": rows,\n            \"nulls_pct\": round(100 * (1 - len(non_null) / rows), 1) if rows else 0.0,\n            \"nunique\": nunique,\n            \"currency\": bool(meta.get(col, {}).get(\"currency\")),\n            \"percent\": bool(meta.get(col, {}).get(\"percent\") or meta.get(col, {}).get(\"percent_fraction\")),\n            \"percent_fraction\": bool(meta.get(col, {}).get(\"percent_fraction\")),\n            \"unit\": meta.get(col, {}).get(\"unit\"),\n            \"period_order\": meta.get(col, {}).get(\"period_order\"),\n        }\n        lowered = set(non_null.astype(str).str.lower().str.strip().unique()) if nunique <= 2 else set()\n\n        if pd.api.types.is_datetime64_any_dtype(s):\n            kind = \"datetime\"\n            info[\"min\"], info[\"max\"] = (str(non_null.min().date()), str(non_null.max().date())) if len(non_null) else (\"\", \"\")\n        elif info[\"period_order\"]:\n            kind = \"period\"\n        elif pd.api.types.is_bool_dtype(s) or (lowered and lowered <= BOOL_VALUES):\n            kind = \"boolean\"\n        elif pd.api.types.is_numeric_dtype(s):\n            integer_like = len(non_null) and (non_null % 1 == 0).all()\n            if re.fullmatch(r\"(fy\\s*)?year\", str(col).strip(), re.I) and integer_like and non_null.between(1900, 2100).all():\n                kind = \"period\"\n                info[\"period_order\"] = sorted(non_null.unique().tolist())\n            else:\n                kind = \"numeric\"\n                if len(non_null):\n                    info.update(min=float(non_null.min()), max=float(non_null.max()),\n                                mean=float(non_null.mean()), sum=float(non_null.sum()))\n        else:\n            avg_len = non_null.astype(str).str.len().mean() if len(non_null) else 0\n            if avg_len > 60:\n                kind = \"text\"\n            elif ID_HINT.search(name_words(col)) or (nunique > 0.9 * len(non_null) and len(non_null) > 15):\n                kind = \"identifier\"\n            else:\n                kind = \"categorical\"\n        info[\"kind\"] = kind\n        samples = non_null.astype(str).value_counts().head(5).index.tolist() if kind != \"datetime\" else non_null.astype(str).head(3).tolist()\n        info[\"samples\"] = [x[:40] for x in samples]\n        out.append(info)\n    return out\n\n\ndef schema_for_ai(df: pd.DataFrame, profiles: list, max_rows: int = 5) -> dict:\n    cols = []\n    for p in profiles:\n        entry = {\"name\": p[\"name\"], \"kind\": p[\"kind\"], \"unique\": p[\"nunique\"], \"nulls_pct\": p[\"nulls_pct\"], \"samples\": p[\"samples\"]}\n        for k in (\"min\", \"max\", \"mean\"):\n            if k in p:\n                entry[k] = round(p[k], 3) if isinstance(p[k], float) else p[k]\n        for k in (\"currency\", \"percent\", \"unit\"):\n            if p.get(k):\n                entry[k] = p[k]\n        cols.append(entry)\n    sample = df.head(max_rows).astype(str).map(lambda v: v[:40]).to_dict(orient=\"records\")\n    return {\"rows\": len(df), \"columns\": cols, \"sample_rows\": sample}\n\n\ndef is_truthy(series: pd.Series) -> pd.Series:\n    if pd.api.types.is_bool_dtype(series):\n        return series.fillna(False)\n    if pd.api.types.is_numeric_dtype(series):\n        return series.fillna(0) > 0\n    return series.astype(str).str.lower().str.strip().isin(TRUTHY)\n",
        "insight_app/qa.py": "\"\"\"Ask a question. Step 1 parses it with rules and answers with pandas (no LLM). Step 2, only for\nopen questions the rules can't handle, sends Claude the schema, KPI values and the aggregated\nchart tables (never the raw rows). Claude replies with text and/or a query spec that pandas runs.\"\"\"\n\nimport json\nimport re\n\nimport pandas as pd\nimport plotly.express as px\n\nfrom insight_app import theme\nfrom insight_app.domain_ai import ai_available, call_claude\nfrom insight_app.domain_rules import primary_measure\nfrom insight_app.engine import _usable_dims as usable_dims\nfrom insight_app.engine import DIM_NOUNS, aggregate, fmt_value, measure_agg, period_label, time_bucket\nfrom insight_app.profiler import MONTH_LOOKUP\n\nMEASURE_WORDS = {\n    \"revenue\": [\"revenue\", \"sales\", \"turnover\", \"income\"], \"profit\": [\"profit\", \"margin\"],\n    \"cost\": [\"cost\", \"expense\", \"spend\"], \"quantity\": [\"units\", \"quantity\", \"qty\", \"volume\"],\n    \"salary\": [\"salary\", \"salaries\", \"pay\", \"ctc\", \"compensation\"], \"csat\": [\"csat\", \"satisfaction\"],\n    \"tickets\": [\"tickets\", \"cases\"], \"resolution_time\": [\"resolution\", \"response time\", \"handle time\"],\n    \"tenure\": [\"tenure\", \"experience\"], \"age\": [\"age\"], \"discount\": [\"discount\"],\n    \"conversions\": [\"conversion\", \"conversions\"], \"clicks\": [\"clicks\"], \"impressions\": [\"impressions\"],\n    \"stock\": [\"stock\", \"inventory\"], \"rating\": [\"rating\", \"score\", \"performance\"],\n}\nDIM_WORDS = {\n    \"region\": [\"region\", \"state\", \"city\", \"location\", \"country\", \"zone\", \"territory\", \"branch\"],\n    \"product\": [\"product\", \"products\", \"item\", \"sku\"], \"category\": [\"category\", \"categories\", \"segment\"],\n    \"department\": [\"department\", \"departments\", \"dept\", \"team\"], \"channel\": [\"channel\", \"channels\", \"source\"],\n    \"agent\": [\"agent\", \"agents\"], \"salesperson\": [\"rep\", \"reps\", \"salesperson\", \"seller\", \"sales person\"],\n    \"job\": [\"job\", \"role\", \"roles\", \"designation\", \"title\", \"position\"],\n    \"customer\": [\"customer\", \"customers\", \"client\", \"clients\", \"account\"], \"gender\": [\"gender\"],\n    \"priority\": [\"priority\"], \"status\": [\"status\"], \"stage\": [\"stage\"],\n}\nOPEN_ENDED = re.compile(r\"\\b(why|explain|recommend|should|suggest|insight|improve|reason|predict|forecast|\"\n                        r\"correlat|relationship|compare|versus|vs|summari[sz]e|what does|meaning|risk|anomal|unusual)\\b\", re.I)\nTREND = re.compile(r\"\\b(trend|over time|monthly|by month|per month|weekly|by week|daily|by day|growth|grow|quarterly|by quarter|timeline)\\b\", re.I)\nTOP = re.compile(r\"\\b(top|highest|most|best|max|maximum|largest|biggest|leading|leader)\\b\", re.I)\nBOTTOM = re.compile(r\"\\b(bottom|lowest|least|worst|min|minimum|smallest|weakest)\\b\", re.I)\nCOUNT = re.compile(r\"\\b(how many|number of|count)\\b\", re.I)\nAVG = re.compile(r\"\\b(average|avg|mean|typical)\\b\", re.I)\nUNIQUE = re.compile(r\"\\b(unique|distinct)\\b\", re.I)\nRETURNS = re.compile(r\"\\b(returns?|returned|refunds?|refunded|cancel\\w*)\\b\", re.I)\nFEES = re.compile(r\"\\b(postage|shipping|delivery charges?|fees?|carriage)\\b\", re.I)\n# friendly words for suggested questions; each one is in MEASURE_WORDS / DIM_WORDS so the parser maps it back\nFRIENDLY = {\"revenue\": \"revenue\", \"quantity\": \"units\", \"salary\": \"salary\", \"tickets\": \"tickets\", \"csat\": \"CSAT\",\n            \"cost\": \"cost\", \"profit\": \"profit\", \"conversions\": \"conversions\", \"stock\": \"stock\", \"rating\": \"rating\",\n            \"product\": \"product\", \"customer\": \"customer\", \"region\": \"region\", \"category\": \"category\",\n            \"department\": \"department\", \"channel\": \"channel\", \"agent\": \"agent\", \"salesperson\": \"rep\", \"job\": \"job role\"}\n\n\ndef _norm(text: str) -> str:\n    return re.sub(r\"[^a-z0-9]\", \"\", str(text).lower())\n\n\ndef _has_word(q: str, word: str) -> bool:\n    return re.search(rf\"(?<![a-z0-9]){re.escape(word.lower())}(?![a-z0-9])\", q) is not None\n\n\n# ---------- shared executor ----------\n\ndef run_query(df: pd.DataFrame, spec: dict, profiles_by_name: dict, roles: dict) -> dict:\n    \"\"\"spec: measure, agg, dim, trend, filters [(col, op, value)], sort, top_n, chart.\n    Returns {headline, table, fig, filters_text}.\"\"\"\n    d, notes = df, []\n    for col, op, value in spec.get(\"filters\", []):\n        if col not in d.columns:\n            continue\n        s = d[col]\n        try:\n            if op == \"contains\":\n                mask = s.astype(str).str.contains(str(value), case=False, regex=False)\n            elif op == \"in\":\n                vals = [str(v).lower() for v in (value if isinstance(value, list) else str(value).split(\",\"))]\n                mask = s.astype(str).str.lower().str.strip().isin([v.strip() for v in vals])\n            elif op in (\">\", \"<\", \">=\", \"<=\"):\n                num = pd.to_numeric(pd.Series([value]), errors=\"coerce\").iloc[0]\n                target = num if pd.notna(num) else pd.to_datetime(value, errors=\"coerce\")\n                mask = {\"<\": s < target, \">\": s > target, \"<=\": s <= target, \">=\": s >= target}[op]\n            elif op == \"year\":\n                mask = s.dt.year == int(value)\n            elif op == \"month\":\n                mask = s.dt.month == int(value)\n            elif op == \"day\":\n                mask = s.dt.day == int(value)\n            elif op == \"!=\":\n                mask = s.astype(str).str.lower() != str(value).lower()\n            else:\n                mask = s.astype(str).str.lower().str.strip() == str(value).lower().strip()\n        except (TypeError, ValueError, AttributeError):\n            continue\n        d = d[mask.fillna(False)]\n        if op == \"year\":\n            notes.append(f\"{col} in {value}\")\n        elif op == \"month\":\n            notes.append(f\"{col} in {pd.Timestamp(2000, int(value), 1):%B}\")\n        elif op == \"day\":\n            notes.append(f\"day {value}\")\n        else:\n            notes.append(f\"{col} {'=' if op == '==' else op} {value}\")\n    filters_text = \"; \".join(notes)\n\n    measure, agg, dim = spec.get(\"measure\") or \"\", spec.get(\"agg\") or \"sum\", spec.get(\"dim\") or \"\"\n    if measure and measure not in d.columns:\n        measure = \"\"\n    if not measure and agg not in (\"count\",):\n        agg = \"count\"\n    if agg in (\"sum\", \"mean\", \"median\", \"min\", \"max\") and measure and not pd.api.types.is_numeric_dtype(d[measure]):\n        agg = \"nunique\" if agg != \"count\" else agg\n    label = \"Records\" if agg == \"count\" else (f\"Avg {measure}\" if agg == \"mean\" else f\"{agg.title()} {measure}\" if agg != \"sum\" else measure)\n    scope = f\" ({filters_text})\" if filters_text else \"\"\n    vfmt = \"percent\" if agg in (\"mean\", \"median\", \"min\", \"max\") and profiles_by_name.get(measure, {}).get(\"percent_fraction\") else \"number\"\n\n    if d.empty:\n        return {\"headline\": f\"No rows match{scope}.\", \"table\": None, \"fig\": None, \"filters_text\": filters_text}\n\n    date = roles.get(\"date\")\n    if spec.get(\"trend\") and date in d.columns:\n        order = profiles_by_name.get(date, {}).get(\"period_order\")\n        if order or pd.api.types.is_datetime64_any_dtype(d[date]):\n            bucket, period = time_bucket(d[date], order)\n            t = aggregate(d.assign(_p=bucket), \"_p\", measure, agg).rename(columns={\"_p\": period.title(), \"value\": label})\n            t = t.sort_values(period.title())\n            fig = px.line(t, x=period.title(), y=label, markers=True, color_discrete_sequence=[theme.PURPLE])\n            first, last = t[label].iloc[0], t[label].iloc[-1]\n            peak = t.loc[t[label].idxmax()]\n            peak_lbl = period_label(peak[period.title()], period)\n            change = f\", {((last - first) / abs(first)):+.0%} from first to last {period}\" if first and period != \"day\" else \"\"\n            return {\"headline\": f\"{label} by {period}{scope}: peak {fmt_value(peak[label], vfmt)} in {peak_lbl}{change}.\",\n                    \"table\": t, \"fig\": fig, \"filters_text\": filters_text}\n\n    if dim and dim in d.columns:\n        t = aggregate(d, dim, measure, agg).dropna()\n        asc = spec.get(\"sort\") == \"asc\"\n        t = t.sort_values(\"value\", ascending=asc).rename(columns={\"value\": label})\n        n = int(spec.get(\"top_n\") or 10)\n        shown = t.head(n)\n        total = t[label].sum()\n        lead = shown.iloc[0]\n        share = f\", {lead[label] / total:.0%} of the total\" if agg in (\"sum\", \"count\") and total else \"\"\n        word = \"lowest\" if asc else \"highest\"\n        if agg == \"count\":\n            headline = f\"{lead[dim]} has the {'fewest' if asc else 'most'} records{scope}: {fmt_value(lead[label], vfmt)}{share}.\"\n        else:\n            headline = f\"{lead[dim]} has the {word} {label}{scope}: {fmt_value(lead[label], vfmt)}{share}.\"\n        if len(shown) > 1:\n            headline += f\" Next: {shown.iloc[1][dim]} ({fmt_value(shown.iloc[1][label], vfmt)}).\"\n        chart = spec.get(\"chart\") or \"bar\"\n        if chart == \"donut\" and agg in (\"sum\", \"count\"):\n            fig = px.pie(shown, names=dim, values=label, hole=0.55, color_discrete_sequence=theme.CHART_COLORS)\n        else:\n            fig = px.bar(shown.assign(**{dim: shown[dim].astype(str)}), x=dim, y=label, color_discrete_sequence=[theme.PURPLE])\n        return {\"headline\": headline, \"table\": shown, \"fig\": fig, \"filters_text\": filters_text}\n\n    if agg == \"count\":\n        value = len(d)\n    elif agg == \"nunique\":\n        value = d[measure].nunique()\n    else:\n        value = getattr(pd.to_numeric(d[measure], errors=\"coerce\").dropna(), agg)()\n    if agg == \"count\":\n        headline = f\"{len(d):,} records match{scope}.\" if filters_text else f\"There are {len(d):,} records.\"\n    else:\n        headline = f\"{label}{scope}: {fmt_value(float(value), vfmt)} across {len(d):,} records.\"\n    return {\"headline\": headline,\n            \"table\": d.head(50), \"fig\": None, \"filters_text\": filters_text}\n\n\n# ---------- rule-based parse ----------\n\ndef parse_rules(question: str, df: pd.DataFrame, roles: dict, profiles: list, domain: str):\n    \"\"\"Returns (spec, matched_something).\"\"\"\n    q = question.lower()\n    qn = _norm(question)\n    by_name = {p[\"name\"]: p for p in profiles}\n    matched = False\n\n    def mentioned(cols):\n        hits = [c for c in cols if (len(_norm(c)) >= 3 and _norm(c) in qn) or _has_word(q, str(c).lower())]\n        return max(hits, key=lambda c: len(_norm(c))) if hits else None\n\n    numeric = [p[\"name\"] for p in profiles if p[\"kind\"] == \"numeric\"]\n    dims = [p[\"name\"] for p in profiles if p[\"kind\"] in (\"categorical\", \"boolean\", \"identifier\", \"period\")]\n\n    measure = mentioned(numeric)\n    if not measure:\n        for role, words in MEASURE_WORDS.items():\n            if role in roles and roles[role] in numeric and any(_has_word(q, w) for w in words):\n                measure = roles[role]\n                break\n    matched |= bool(measure)\n    explicit_measure = bool(measure)\n\n    dim = mentioned([c for c in dims if c != measure])\n    if not dim:\n        for role, words in DIM_WORDS.items():\n            if role in roles and roles[role] in df.columns and any(_has_word(q, w) for w in words):\n                dim = roles[role]\n                break\n    matched |= bool(dim)\n\n    filters = []\n    # Line Type values (\"Product\") collide with ordinary words, so it is matched by RETURNS / FEES below instead\n    for col in [p[\"name\"] for p in profiles if p[\"kind\"] in (\"categorical\", \"boolean\") and p[\"nunique\"] <= 500\n                and p[\"name\"] != roles.get(\"line_type\")]:\n        values = df[col].dropna().astype(str).unique()\n        hits = [v for v in values if len(v) >= 3 and (_has_word(q, v) or _has_word(q, v + \"s\") or _has_word(q, v + \"ed\"))]\n        if hits:\n            best = max(hits, key=len)\n            if col == dim and not (TOP.search(q) or BOTTOM.search(q)):\n                dim = \"\"\n            filters.append((col, \"==\", best))\n            matched = True\n\n    line_type = roles.get(\"line_type\")\n    if line_type in df.columns and RETURNS.search(q):\n        filters.append((line_type, \"==\", \"Return\"))\n        matched = True\n    elif line_type in df.columns and FEES.search(q):\n        filters.append((line_type, \"==\", \"Shipping & fees\"))\n        matched = True\n    elif line_type in df.columns and dim and dim == roles.get(\"product\"):\n        # product rankings leave out postage/fee lines and returns, like the dashboard does\n        filters.append((line_type, \"==\", \"Product\"))\n\n    date = roles.get(\"date\")\n    if date and pd.api.types.is_datetime64_any_dtype(df.get(date, pd.Series(dtype=float))):\n        year = re.search(r\"\\b(19|20)\\d{2}\\b\", q)\n        if year:\n            filters.append((date, \"year\", int(year.group())))\n            matched = True\n        for name, num in MONTH_LOOKUP.items():\n            if len(name) >= 3 and _has_word(q, name) and not (name == \"may\" and \"may i\" in q):\n                filters.append((date, \"month\", num))\n                day = re.search(rf\"\\b(\\d{{1,2}})(?:st|nd|rd|th)?\\s+(?:of\\s+)?{name}\\b|\\b{name}\\s+(\\d{{1,2}})(?:st|nd|rd|th)?\\b\", q)\n                if day:\n                    filters.append((date, \"day\", int(day.group(1) or day.group(2))))\n                matched = True\n                break\n\n    if COUNT.search(q) or (RETURNS.search(q) and line_type in df.columns and not explicit_measure):\n        agg = \"count\"\n        matched = True\n    elif UNIQUE.search(q) and dim:\n        agg, measure, dim = \"nunique\", dim, \"\"\n    elif AVG.search(q):\n        agg = \"mean\"\n    else:\n        agg = measure_agg(measure, roles, by_name) if measure else \"sum\"\n    if not measure and agg != \"count\":\n        measure = primary_measure(domain, roles, profiles) or \"\"\n        if not measure:\n            agg = \"count\"\n        elif agg != \"mean\":\n            agg = measure_agg(measure, roles, by_name)\n\n    top_n = re.search(r\"\\b(?:top|bottom)\\s+(\\d{1,2})\\b\", q)\n    spec = {\"measure\": measure, \"agg\": agg, \"dim\": dim, \"trend\": bool(TREND.search(q)), \"filters\": filters,\n            \"sort\": \"asc\" if BOTTOM.search(q) else \"desc\", \"top_n\": int(top_n.group(1)) if top_n else 10, \"chart\": \"bar\"}\n    matched |= spec[\"trend\"] or bool(TOP.search(q) or BOTTOM.search(q)) and bool(dim)\n    return spec, matched\n\n\ndef suggest_questions(roles: dict, profiles: list, domain: str, metric_table: dict = None, df: pd.DataFrame = None) -> list:\n    \"\"\"Starter questions built from the columns, all answerable by the rule parser.\"\"\"\n    if metric_table and df is not None and len(df):\n        names = df[metric_table[\"label\"]].astype(str).tolist()\n        out = [f\"What was {n} in {metric_table['latest']}?\" for n in names[:3]]\n        out.append(f\"Which {metric_table['label']} has the highest {metric_table['latest']}?\")\n        return out\n    by_name = {p[\"name\"]: p for p in profiles}\n    inverse = {v: k for k, v in roles.items()}\n    measure = primary_measure(domain, roles, profiles)\n    dims = [d for d in usable_dims(profiles, roles) if inverse.get(d) != \"line_type\"]\n    name = lambda col: FRIENDLY.get(inverse.get(col), col)  # noqa: E731\n    out = []\n    if measure:\n        word = \"average \" if measure_agg(measure, roles, by_name) == \"mean\" else \"total \"\n        m = name(measure)\n        if dims:\n            out.append(f\"Which {name(dims[0])} has the highest {word}{m}?\")\n        if roles.get(\"date\"):\n            out.append(f\"Show the {m} trend over time\")\n        plural = lambda col: DIM_NOUNS.get(inverse.get(col), col)  # noqa: E731\n        if len(dims) > 1:\n            out.append(f\"Top 5 {plural(dims[1])} by {m}\")\n        elif dims:\n            out.append(f\"Top 5 {plural(dims[0])} by {m}\")\n    if roles.get(\"line_type\"):\n        out.append(\"Which products were returned?\")\n    elif dims and len(out) < 5:\n        top_value = by_name[dims[0]][\"samples\"][0] if by_name[dims[0]][\"samples\"] else \"\"\n        if top_value:\n            out.append(f\"How many records are in {top_value}?\")\n    if not out:\n        out.append(\"How many records are there?\")\n    return out[:5]\n\n\n# ---------- AI step ----------\n\nAI_SYSTEM = \"\"\"You answer a manager's question about a dashboard built from their data.\nYou get the table schema, the KPI values on screen, aggregated chart tables and pandas-computed insights.\nYou never see the raw rows.\n\nIf the context already holds what is needed, answer in `answer` (2 to 4 short sentences, plain English,\nspecific numbers from the context) and set use_query to false.\nIf the answer needs a calculation the context lacks, set use_query to true and fill `query`; pandas will run it\nand show the result under your text, so write `answer` as one sentence saying what the table shows and do not\ninvent numbers.\nQuery fields: metric = exact numeric column (\"\" to count rows); agg = sum|mean|median|min|max|count|nunique;\ngroup_by = exact column or \"\"; time_trend = true for a trend over the date column; filters = list of\n{column, op (==, !=, >, <, >=, <=, contains, in), value}; sort = desc|asc; top_n = 1 to 25; chart = bar|line|donut|none.\nWrite plainly. No em dashes. If the data cannot answer the question, say so and suggest what data would.\"\"\"\n\n\ndef _ai_schema():\n    s = {\"type\": \"string\"}\n    flt = {\"type\": \"object\", \"additionalProperties\": False,\n           \"properties\": {\"column\": s, \"op\": {\"type\": \"string\", \"enum\": [\"==\", \"!=\", \">\", \"<\", \">=\", \"<=\", \"contains\", \"in\"]}, \"value\": s},\n           \"required\": [\"column\", \"op\", \"value\"]}\n    query = {\"type\": \"object\", \"additionalProperties\": False,\n             \"properties\": {\"metric\": s, \"agg\": {\"type\": \"string\", \"enum\": [\"sum\", \"mean\", \"median\", \"min\", \"max\", \"count\", \"nunique\"]},\n                            \"group_by\": s, \"time_trend\": {\"type\": \"boolean\"}, \"filters\": {\"type\": \"array\", \"items\": flt},\n                            \"sort\": {\"type\": \"string\", \"enum\": [\"desc\", \"asc\"]}, \"top_n\": {\"type\": \"integer\"},\n                            \"chart\": {\"type\": \"string\", \"enum\": [\"bar\", \"line\", \"donut\", \"none\"]}},\n             \"required\": [\"metric\", \"agg\", \"group_by\", \"time_trend\", \"filters\", \"sort\", \"top_n\", \"chart\"]}\n    return {\"type\": \"object\", \"additionalProperties\": False,\n            \"properties\": {\"answer\": s, \"use_query\": {\"type\": \"boolean\"}, \"query\": query},\n            \"required\": [\"answer\", \"use_query\", \"query\"]}\n\n\ndef _context(ctx: dict) -> str:\n    tables = []\n    for title, t in ctx.get(\"chart_tables\", [])[:12]:\n        if t is None or t.empty:\n            continue\n        tables.append(f\"## {title}\\n{t.head(12).to_csv(index=False)}\")\n    payload = {\n        \"domain\": ctx[\"domain\"], \"file\": ctx.get(\"filename\"), \"active_filters\": ctx.get(\"filters_text\") or \"none\",\n        \"rows_in_view\": ctx.get(\"rows\"), \"column_roles\": ctx[\"roles\"], \"schema\": ctx[\"schema\"],\n        \"kpis\": ctx.get(\"kpi_values\", []), \"insights\": ctx.get(\"insights\", []),\n    }\n    return json.dumps(payload, default=str, indent=1) + \"\\n\\nChart tables (CSV):\\n\" + \"\\n\".join(tables)\n\n\ndef answer(question: str, df: pd.DataFrame, ctx: dict) -> dict:\n    roles, profiles, domain = ctx[\"roles\"], ctx[\"profiles\"], ctx[\"domain\"]\n    by_name = {p[\"name\"]: p for p in profiles}\n    spec, matched = parse_rules(question, df, roles, profiles, domain)\n    open_ended = bool(OPEN_ENDED.search(question))\n\n    if (matched and not open_ended) or not ai_available():\n        res = run_query(df, spec, by_name, roles)\n        note = \"\" if matched else \"I couldn't match this to specific columns, so here is the headline number. Add a column or value name from your data, or add an API key for open questions.\"\n        return {\"question\": question, \"text\": res[\"headline\"], \"note\": note, \"table\": res[\"table\"], \"fig\": res[\"fig\"], \"source\": \"pandas\"}\n\n    try:\n        out = call_claude(AI_SYSTEM, f\"{_context(ctx)}\\n\\nQuestion: {question}\", _ai_schema(), max_tokens=4000)\n    except Exception as e:  # noqa: BLE001\n        res = run_query(df, spec, by_name, roles)\n        return {\"question\": question, \"text\": res[\"headline\"], \"note\": f\"AI answer unavailable ({type(e).__name__}); showing the pandas result.\",\n                \"table\": res[\"table\"], \"fig\": res[\"fig\"], \"source\": \"pandas\"}\n\n    result = {\"question\": question, \"text\": out.get(\"answer\", \"\"), \"note\": \"\", \"table\": None, \"fig\": None, \"source\": \"ai\"}\n    if out.get(\"use_query\"):\n        qy = out[\"query\"]\n        q_spec = {\"measure\": qy.get(\"metric\", \"\"), \"agg\": qy.get(\"agg\", \"sum\"), \"dim\": qy.get(\"group_by\", \"\"),\n                  \"trend\": bool(qy.get(\"time_trend\")), \"sort\": qy.get(\"sort\", \"desc\"),\n                  \"top_n\": max(1, min(25, int(qy.get(\"top_n\") or 10))), \"chart\": qy.get(\"chart\", \"bar\"),\n                  \"filters\": [(f[\"column\"], f[\"op\"], f[\"value\"]) for f in qy.get(\"filters\", [])]}\n        res = run_query(df, q_spec, by_name, roles)\n        result.update(table=res[\"table\"], fig=res[\"fig\"] if qy.get(\"chart\") != \"none\" else None,\n                      text=f\"{result['text']} {res['headline']}\".strip(), source=\"ai+pandas\")\n    return result\n",
        "insight_app/report.py": "\"\"\"Single-file HTML report: KPIs, insights, every chart (interactive, works offline), Q&A, data profile.\"\"\"\n\nimport html\nfrom datetime import datetime\n\nimport pandas as pd\n\nfrom insight_app import theme\n\n\ndef _kpi_html(k: dict) -> str:\n    delta = \"\"\n    if k.get(\"delta\"):\n        pct = k[\"delta\"][\"pct\"]\n        good = (pct < 0) if k.get(\"lower_better\") else (pct > 0)\n        cls = \"up\" if good else \"down\" if pct else \"\"\n        arrow = \"&#9650;\" if pct > 0 else \"&#9660;\" if pct < 0 else \"&#9644;\"\n        delta = f'<div class=\"sub\"><span class=\"{cls}\">{arrow} {abs(pct):.1%}<\/span> {html.escape(k[\"delta\"][\"label\"])}<\/div>'\n    sub = f'<div class=\"sub\">{html.escape(k[\"sub\"])}<\/div>' if k.get(\"sub\") else \"\"\n    return (f'<div class=\"kpi\"><div class=\"lbl\">{html.escape(k[\"title\"])}<\/div>'\n            f'<div class=\"val\">{html.escape(k[\"display\"])}<\/div>{delta}{sub}<\/div>')\n\n\ndef build_html(meta: dict, kpis: list, insights: list, charts: list, qa_history: list, profile_df: pd.DataFrame) -> str:\n    \"\"\"charts: list of (tab, spec, fig). qa_history: list of answer dicts from qa.answer.\"\"\"\n    parts, first = [], True\n    for tab in (\"Overview\", \"Breakdown\", \"Distribution\"):\n        figs = [(s, f) for t, s, f in charts if t == tab]\n        if not figs:\n            continue\n        parts.append(f\"<h2>{tab}<\/h2><div class='grid'>\")\n        for spec, fig in figs:\n            div = fig.to_html(full_html=False, include_plotlyjs=\"inline\" if first else False,\n                              config={\"displaylogo\": False, \"responsive\": True})\n            first = False\n            why = f\"<p class='why'>{html.escape(spec['why'])}<\/p>\" if spec.get(\"why\") else \"\"\n            parts.append(f\"<div class='card'>{div}{why}<\/div>\")\n        parts.append(\"<\/div>\")\n\n    qa = \"\"\n    if qa_history:\n        items = []\n        for a in qa_history:\n            table = a[\"table\"].head(15).to_html(index=False, classes=\"tbl\", border=0) if a.get(\"table\") is not None else \"\"\n            fig = \"\"\n            if a.get(\"fig\") is not None:\n                fig = a[\"fig\"].to_html(full_html=False, include_plotlyjs=\"inline\" if first else False, config={\"displaylogo\": False})\n                first = False\n            items.append(f\"<div class='card'><p class='q'>Q: {html.escape(a['question'])}<\/p>\"\n                         f\"<p>{html.escape(a['text'])}<\/p>{fig}{table}<\/div>\")\n        qa = \"<h2>Questions and answers<\/h2>\" + \"\".join(items)\n\n    insight_html = \"\".join(f\"<li>{html.escape(i)}<\/li>\" for i in insights)\n    filters = html.escape(meta.get(\"filters\") or \"None\")\n    return f\"\"\"<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>{html.escape(meta['domain'])} Dashboard Report<\/title>\n<style>\nbody {{ font-family: Poppins, 'Segoe UI', sans-serif; background: {theme.PAGE_BG}; color: {theme.TEXT}; margin: 0; }}\n.wrap {{ max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }}\n.hero {{ background: {theme.KPI_GRADIENT}; color: #fff; border-radius: 16px; padding: 22px 26px; }}\n.hero h1 {{ margin: 0 0 6px; font-size: 26px; }} .hero p {{ margin: 2px 0; opacity: .9; }}\n.chip {{ display: inline-block; background: {theme.YELLOW}; color: {theme.NAVY}; font-weight: 600; border-radius: 999px; padding: 2px 12px; font-size: 12px; }}\nh2 {{ color: {theme.NAVY}; margin: 28px 0 12px; font-size: 19px; border-left: 5px solid {theme.PURPLE}; padding-left: 10px; }}\n.kpis {{ display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }}\n.kpi {{ background: #fff; border-radius: 14px; padding: 14px 16px; border-top: 5px solid {theme.PURPLE}; box-shadow: 0 1px 3px rgba(23,26,95,.08); }}\n.kpi .lbl {{ color: {theme.MUTED}; font-size: 12.5px; }} .kpi .val {{ color: {theme.NAVY}; font-size: 24px; font-weight: 700; }}\n.kpi .sub {{ color: {theme.MUTED}; font-size: 11.5px; }} .up {{ color: #3E8A0A; font-weight: 600; }} .down {{ color: #C2620C; font-weight: 600; }}\n.grid {{ display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 14px; }}\n@media (max-width: 560px) {{ .grid {{ grid-template-columns: 1fr; }} }}\n.card {{ background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(23,26,95,.08); margin-bottom: 12px; overflow-x: auto; }}\n.why {{ color: {theme.MUTED}; font-size: 12px; margin: 4px 6px; }} .q {{ font-weight: 600; color: {theme.PURPLE}; }}\n.tbl {{ border-collapse: collapse; font-size: 12.5px; width: 100%; }} .tbl th {{ background: {theme.NAVY}; color: #fff; text-align: left; padding: 6px 8px; }}\n.tbl td {{ padding: 5px 8px; border-bottom: 1px solid #ECEBF3; }}\nul.ins li {{ margin-bottom: 6px; }} footer {{ color: {theme.MUTED}; font-size: 12px; margin-top: 30px; }}\n<\/style><\/head><body><div class=\"wrap\">\n<div class=\"hero\"><span class=\"chip\">{html.escape(meta['domain'])}<\/span>\n<h1>{html.escape(meta['domain'])} Dashboard<\/h1>\n<p>{html.escape(meta.get('summary', ''))}<\/p>\n<p>Source: {html.escape(meta.get('filename', ''))} | {meta.get('rows', 0):,} rows in view | Filters: {filters}<\/p><\/div>\n<div class=\"kpis\">{''.join(_kpi_html(k) for k in kpis)}<\/div>\n<h2>Key insights<\/h2><div class=\"card\"><ul class=\"ins\">{insight_html or '<li>No insights for this view.<\/li>'}<\/ul><\/div>\n{''.join(parts)}\n{qa}\n<h2>Data profile<\/h2><div class=\"card\">{profile_df.to_html(index=False, classes='tbl', border=0)}<\/div>\n<footer>Generated by InsightIQ on {datetime.now():%d %b %Y, %H:%M}. Numbers computed with pandas from the uploaded file.<\/footer>\n<\/div><\/body><\/html>\"\"\"\n",
        "insight_app/theme.py": "\"\"\"Electric Carnival palette, Plotly template and Streamlit CSS for InsightIQ.\"\"\"\n\nimport plotly.graph_objects as go\nimport plotly.io as pio\nimport streamlit as st\n\nGREEN = \"#5CB714\"\nPURPLE = \"#7D11A4\"\nNAVY = \"#171A5F\"\nYELLOW = \"#F1CC22\"\nORANGE = \"#F08C24\"\n\n# Yellow is a fill colour only: it fails contrast as text on white.\nCHART_COLORS = [PURPLE, GREEN, ORANGE, NAVY, YELLOW, \"#B04FD1\", \"#8FD45A\", \"#F5B46B\", \"#4A4F9C\", \"#F7DE6E\"]\nSEQUENTIAL = [\"#F4ECF8\", \"#D9B3E8\", \"#B06BCC\", PURPLE, NAVY]\nDIVERGING = [ORANGE, \"#F7C894\", \"#F5F5F7\", \"#B5DE91\", GREEN]\n\nPAGE_BG = \"#F7F6FB\"\nCARD_BG = \"#FFFFFF\"\nTEXT = \"#1E1F3B\"\nMUTED = \"#5F6180\"\nKPI_GRADIENT = f\"linear-gradient(135deg, {PURPLE} 0%, {NAVY} 100%)\"\n\n\ndef register_plotly_template():\n    template = go.layout.Template()\n    template.layout = go.Layout(\n        colorway=CHART_COLORS,\n        font={\"family\": \"Poppins, Segoe UI, sans-serif\", \"color\": TEXT, \"size\": 12},\n        title={\"font\": {\"size\": 15, \"color\": NAVY}, \"x\": 0.01, \"xanchor\": \"left\"},\n        paper_bgcolor=CARD_BG,\n        plot_bgcolor=CARD_BG,\n        margin={\"l\": 48, \"r\": 20, \"t\": 56, \"b\": 44},\n        xaxis={\"gridcolor\": \"#ECEBF3\", \"linecolor\": \"#D8D7E3\", \"zeroline\": False},\n        yaxis={\"gridcolor\": \"#ECEBF3\", \"linecolor\": \"#D8D7E3\", \"zeroline\": False},\n        legend={\"orientation\": \"h\", \"yanchor\": \"bottom\", \"y\": 1.02, \"xanchor\": \"right\", \"x\": 1},\n        hoverlabel={\"bgcolor\": NAVY, \"font\": {\"color\": \"white\"}},\n        colorscale={\"sequential\": [[i / (len(SEQUENTIAL) - 1), c] for i, c in enumerate(SEQUENTIAL)]},\n    )\n    pio.templates[\"carnival\"] = template\n    pio.templates.default = \"plotly_white+carnival\"\n\n\ndef inject_css():\n    st.markdown(\n        f\"\"\"\n        <style>\n        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400
